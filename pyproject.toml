[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hledger-ai"
version = "0.2.0"
description = "Local-first AI models for receipt OCR and transaction classification"
requires-python = ">=3.10"
dependencies = [
    "hledger-core>=0.1.0",
    "pydantic>=2.0",
    "requests>=2.28",
    "Pillow>=9.0",
    "typeguard>=2.13.3",
]

[project.optional-dependencies]
setfit = [
    "setfit>=1.0",
    "sentence-transformers>=2.2",
]
finetune = [
    "peft>=0.10",
    "trl>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 80

[tool.isort]
profile = "black"

[tool.mypy]
ignore_missing_imports = true
