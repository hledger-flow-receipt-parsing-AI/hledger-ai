[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hledger-ai"
version = "0.2.0"
description = "Local-first AI models for receipt OCR and transaction classification"
requires-python = ">=3.10"
dependencies = [
    "hledger-core>=0.1.0",
    "pydantic>=2.0",
    "requests>=2.28",
    "Pillow>=9.0",
    "typeguard>=2.13.3",
    # Tier-1 priors and tier-2 linear models (requirements TR-1).
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.3",
]

[project.scripts]
hledger-ai = "hledger_ai.cli:main"

[project.optional-dependencies]
# OCR for the image models. rapidocr itself is installed by install_ai.sh
# with --no-deps: its opencv-python-headless dependency would replace the
# GUI build of OpenCV that the receipt rotate/crop windows need.
ocr = [
    "onnxruntime>=1.17",
    "omegaconf",
    "colorlog",
    "pyclipper",
    "shapely",
]
# Pausing background work on battery power (BG-2).
background = ["psutil>=5.9"]
setfit = [
    "setfit>=1.0",
    "sentence-transformers>=2.2",
]
finetune = [
    "peft>=0.10",
    "trl>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hledger_ai = ["runtimes/*.mjs"]

[tool.black]
line-length = 80

[tool.isort]
profile = "black"

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["test"]
filterwarnings = [
    # joblib still sets array shapes in place; harmless, not ours to fix.
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]
markers = ["slow: needs an installed model runtime and takes long"]
addopts = "-m 'not slow'"
